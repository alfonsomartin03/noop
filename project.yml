name: Strand
options:
  bundleIdPrefix: com.noopapp
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
packages:
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
  StrandSync:
    path: Packages/StrandSync
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
    entitlements:
      path: Strand/Resources/Strand.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        # iPhone sync receiver (#79): listens only while the user turns it on in Settings.
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop
        PRODUCT_NAME: NOOP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: StrandSync
  StrandPhone:
    # iPhone collector shell (#76). Collects nothing yet; see docs/sprints/PHONE_MAC_ARCHIVE.md.
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrandPhone
        excludes:
          - "Info.plist"
      # Shared with the Mac (#78): the same strap link, decoding and persist-before-ack collection.
      - path: Strand/BLE
      - path: Strand/Collect
    info:
      path: StrandPhone/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to download its data, which it keeps on this iPhone only until your Mac has it."
        NSLocalNetworkUsageDescription: "NOOP sends your strap data to your own Mac on this network and gets your scores back. Nothing goes to the internet."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop.phone
        PRODUCT_NAME: NOOP
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandDesign
      - package: StrandSync
      - package: StrandAnalytics
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - StrandTests
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.strandtests
        # The app's PRODUCT_NAME is NOOP, so XcodeGen's default Strand.app host doesn't exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP.app/Contents/MacOS/NOOP"
schemes:
  Strand:
    build:
      targets:
        Strand: all
        StrandTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrandTests
      # Keeps the test host from starting BLE or the store (see AppEntry in StrandApp.swift).
      environmentVariables:
        - variable: NOOP_TEST_HOST
          value: "1"
          isEnabled: true
  StrandPhone:
    build:
      targets:
        StrandPhone: all
    run:
      config: Debug
